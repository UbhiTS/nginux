name: Release

# A release is an explicit versioned change, not a side effect of every push to
# main. Updating version.ts triggers the gated multi-arch image build, tag, and
# GitHub Release. Ordinary main pushes are covered by ci.yml and cannot silently
# manufacture a new version with stale application metadata or release notes.
on:
  push:
    branches: [main]
    paths:
      - "server/src/version.ts"

# Avoid two releases racing if pushes land back-to-back.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# Run the bundled JS actions (checkout, setup-node, buildx, login, build-push) on
# Node 24 now - they still ship a Node 20 runtime, which GitHub is deprecating and
# will force to Node 24 anyway. Opting in early silences the warning and de-risks
# the cutover. Drop this once the actions default to Node 24 on their own.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Gate publishing on a green typecheck + server tests + web typecheck/tests + web
  # build, so a broken or regressed build never ships. Any red step fails the release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck --workspace server
      - run: npm run test --workspace server
      # Prove the data-plane boundary end-to-end: real nginx, fed the app's own generated
      # config, must never let an under-authenticated request reach a backend. nginx-full
      # ships the auth_request module; the harness assembles its own module-free wrapper.
      - name: Install nginx (real-nginx integration test)
        run: sudo apt-get update && sudo apt-get install -y nginx-full
      - name: Data-plane integration test (forward-auth boundary through real nginx)
        env:
          NGINUX_NGINX_BIN: /usr/sbin/nginx
          NGINUX_REQUIRE_NGINX: "1"   # a missing nginx must FAIL the release gate, not skip
        run: npm run test:integration --workspace server
      - run: npx tsc --noEmit --types vite/client,vitest/globals,@testing-library/jest-dom,node
        working-directory: web
      - run: npm run test --workspace web
      - run: npm run build --workspace web

  # Build the ACTUAL runtime image and boot it. `verify` exercises code + real nginx but
  # never boots the container, so a startup crash (e.g. a write to a path missing from the
  # image) shipped undetected in v0.1.5. This gate boots the image on a throwaway volume
  # and fails the release unless the control plane answers /api/health.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build runtime image (single-arch, fast)
        run: docker build -t nginux:smoke --build-arg GIT_SHA="$GITHUB_SHA" .
      - name: Scan runtime image (fixed high/critical CVEs)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 nginux:smoke
      - name: Boot the container on a throwaway volume
        # Boot under the SAME hardening the product ships (docker-compose cap set +
        # no-new-privileges), so the smoke gate exercises the real setpriv/ambient-cap
        # path instead of default-privileged Docker.
        run: >
          docker run -d --name smoke
          --cap-drop ALL
          --cap-add NET_BIND_SERVICE --cap-add CHOWN --cap-add SETUID
          --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add KILL
          --security-opt no-new-privileges:true
          -v "$RUNNER_TEMP/smoke:/data" nginux:smoke
      - name: Control plane must answer /api/health (catches a boot crash-loop)
        run: |
          for i in $(seq 1 30); do
            if docker exec smoke wget -qO- http://127.0.0.1:6767/api/health >/dev/null 2>&1; then
              echo "healthy after ~$((i*3))s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke 2>/dev/null)" != "true" ]; then
              echo "::error::container exited early (startup crash)"; docker logs smoke; exit 1
            fi
            sleep 3
          done
          echo "::error::control plane never became healthy"; docker logs smoke; exit 1
      - name: Teardown
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

  release:
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create tags + releases
      packages: write   # push to GHCR
      id-token: write   # keyless Sigstore certificate for image provenance
      attestations: write
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          # The source version is authoritative. Never auto-increment a tag
          # independently of the version the API/UI and package manifests report.
          file_ver="v$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' server/src/version.ts | head -n1)"
          if git rev-parse -q --verify "refs/tags/$file_ver" >/dev/null; then
            echo "::error::Tag $file_ver already exists; choose a fresh source version."
            exit 1
          fi
          if [ -n "$latest" ] && \
             [ "$(printf '%s\n%s\n' "$latest" "$file_ver" | sort -V | tail -n1)" != "$file_ver" ]; then
            echo "::error::Source version $file_ver must be greater than latest tag $latest."
            exit 1
          fi
          echo "latest=${latest:-none}" >> "$GITHUB_OUTPUT"
          echo "next=$file_ver" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-none} · source version: $file_ver"

      - name: Lowercase image repo
        id: image
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nginux" >> "$GITHUB_OUTPUT"

      # QEMU lets the amd64 runner cross-build the arm64 image (Apple Silicon,
      # Raspberry Pi, ARM NAS) so the published image is multi-arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.repo }}:${{ steps.version.outputs.next }}
            ${{ steps.image.outputs.repo }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.next }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          IMAGE: ${{ steps.image.outputs.repo }}
        run: |
          git tag "$NEXT" "${{ github.sha }}"
          git push origin "$NEXT"
          # Use the curated, version-controlled notes and append the version-specific
          # image line, so every release ships a real description instead of an empty body.
          {
            cat RELEASE_NOTES.md
            echo ""
            echo "---"
            echo ""
            echo "**Docker image:** \`$IMAGE:$NEXT\` (also tagged \`:latest\`)."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$NEXT" \
            --title "$NEXT" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
